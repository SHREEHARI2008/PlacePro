<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Back Clipboard (Tilted) -->
  <g transform="rotate(-9, 130, 120)">
    <rect x="75" y="35" width="110" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" filter="url(#shadow)" />
    <!-- Back Clip -->
    <rect x="110" y="27" width="40" height="16" rx="4" fill="#6366f1" />
    <circle cx="130" cy="22" r="5" fill="none" stroke="#6366f1" stroke-width="2.5" />
    <!-- Sheet Lines -->
    <line x1="90" y1="65" x2="165" y2="65" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <line x1="90" y1="85" x2="155" y2="85" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <line x1="90" y1="105" x2="160" y2="105" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Front Clipboard (Straight / Clean) -->
  <g>
    <rect x="110" y="45" width="115" height="155" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)" />
    <!-- Front Clip -->
    <rect x="145" y="37" width="44" height="18" rx="4" fill="#6366f1" />
    <circle cx="167" cy="31" r="5.5" fill="none" stroke="#6366f1" stroke-width="3" />
    <!-- Clean inner blank page -->
    <rect x="118" y="55" width="99" height="137" rx="4" fill="#ffffff" />
  </g>
</svg>
